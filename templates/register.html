<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | SkillTrack</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <nav class="navbar">
        <a href="/" class="logo">✦ SkillTrack</a>
        <a href="/" class="secondary-btn">Home</a>
    </nav>

    <main class="auth-wrapper">
        <form class="auth-card" method="POST">
            <p class="tagline">START YOUR JOURNEY</p>
            <h1>Create your account</h1>
            <p class="auth-description">Build skills. Track progress. Reach your career goal.</p>

            {% with messages = get_flashed_messages() %}
            {% for message in messages %}
            <p class="notice">{{ message }}</p>
            {% endfor %}
            {% endwith %}

            <label>Full Name</label>
            <input type="text" name="name" placeholder="Enter your name" required>

            <label>Email Address</label>
            <input type="email" name="email" placeholder="you@example.com" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="At least 8 characters" minlength="8" required>

            <button class="primary-btn full-btn" type="submit">Create Account →</button>

            <p class="auth-footer">Already have an account? <a href="/login">Login</a></p>
        </form>
    </main>
</body>

</html>
